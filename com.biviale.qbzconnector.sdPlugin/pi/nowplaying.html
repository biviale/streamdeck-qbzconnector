<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Now playing</title>
		<link rel="stylesheet" href="pi.css" />
		<script src="pi.js"></script>
	</head>
	<body>
		<div class="row check">
			<label for="showArtwork">Cover art</label>
			<span><input id="showArtwork" type="checkbox" data-setting="showArtwork" /> show in background</span>
		</div>

		<div class="row">
			<label for="titleMode">Text</label>
			<select id="titleMode" data-setting="titleMode">
				<option value="title">Title</option>
				<option value="artist">Artist</option>
				<option value="both">Title and artist</option>
				<option value="none">None</option>
			</select>
		</div>

		<hr />
		<div class="row check">
			<label for="tintFromArtwork">Colour</label>
			<span
				><input id="tintFromArtwork" type="checkbox" data-global="tintFromArtwork" /> tint from the
				cover</span
			>
		</div>
		<p class="note">
			<strong>Global</strong> setting: it applies to every QBZ Connector key. The cover's dominant
			colour is darkened as much as it takes for the symbols to stay readable.
		</p>
	</body>
</html>
