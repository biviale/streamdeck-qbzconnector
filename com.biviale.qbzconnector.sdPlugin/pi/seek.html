<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Seeking</title>
		<link rel="stylesheet" href="pi.css" />
		<script src="pi.js"></script>
	</head>
	<body>
		<div class="row">
			<label for="seconds">Amount (s)</label>
			<input id="seconds" type="number" min="1" max="600" step="1" data-setting="seconds" />
		</div>
		<p class="note">How many seconds each press moves.</p>

		<hr />
		<div class="row check">
			<label for="tintFromArtwork">Colour</label>
			<span
				><input id="tintFromArtwork" type="checkbox" data-global="tintFromArtwork" /> tint from the
				cover</span
			>
		</div>
		<p class="note">
			<strong>Global</strong> setting: it applies to every QBZ Connector key. The cover's dominant
			colour is darkened as much as it takes for the symbols to stay readable.
		</p>
	</body>
</html>
